name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cargo Test
      run: cargo test --verbose
      
    - name: Cargo Clippy
      run: cargo clippy -- -D warnings
      
    - name: Cargo Check
      run: cargo check
      
  slo-sli:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Generate SLI Report
      run: |
        echo "## SLI/SLO Metrics" > metrics.md
        echo "- Test Coverage: TBD" >> metrics.md
        echo "- Build Time: <2min" >> metrics.md
        echo "- Deployment Freq: Daily" >> metrics.md
    - uses: actions/upload-artifact@v4
      with:
        name: slo-report
        path: metrics.md
