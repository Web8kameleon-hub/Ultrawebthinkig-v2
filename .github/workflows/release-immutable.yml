name: Release - Immutable Artifacts

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. v2026.03.05-1)"
        required: true
        type: string
      publish_images:
        description: "Push images to registry"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: immutable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-immutable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ${{ github.repository_owner }}/clisonix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' || inputs.publish_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Ocean Enterprise API image
        id: ocean
        uses: docker/build-push-action@v6
        with:
          context: ./ocean-core
          file: ./ocean-core/Dockerfile
          push: ${{ github.event_name == 'push' || inputs.publish_images }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ocean-enterprise:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Build Trinity Analytics image
        id: trinity
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.alba
          push: ${{ github.event_name == 'push' || inputs.publish_images }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-trinity-analytics:${{ steps.ver.outputs.version }}

      - name: Build Regulated AI Copilot image
        id: regulated
        uses: docker/build-push-action@v6
        with:
          context: ./services/regulatory
          file: ./services/regulatory/Dockerfile
          push: ${{ github.event_name == 'push' || inputs.publish_images }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-regulated-copilot:${{ steps.ver.outputs.version }}

      - name: Immutable manifest
        run: |
          mkdir -p release-artifacts
          cat > release-artifacts/immutable-manifest.json << 'EOF'
          {
            "release_version": "${{ steps.ver.outputs.version }}",
            "git_sha": "${{ github.sha }}",
            "created_at": "${{ github.run_id }}",
            "images": {
              "ocean_enterprise_api": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ocean-enterprise:${{ steps.ver.outputs.version }}",
              "trinity_analytics": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-trinity-analytics:${{ steps.ver.outputs.version }}",
              "regulated_ai_copilot": "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-regulated-copilot:${{ steps.ver.outputs.version }}"
            }
          }
          EOF
          cat release-artifacts/immutable-manifest.json

      - name: Upload immutable manifest
        uses: actions/upload-artifact@v4
        with:
          name: immutable-release-${{ steps.ver.outputs.version }}
          path: release-artifacts/immutable-manifest.json

      - name: Release summary
        run: |
          echo "## Immutable Release" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \\`${{ steps.ver.outputs.version }}\\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \\`${{ github.sha }}\\`" >> $GITHUB_STEP_SUMMARY
          echo "- Ocean image: \\`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ocean-enterprise:${{ steps.ver.outputs.version }}\\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trinity image: \\`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-trinity-analytics:${{ steps.ver.outputs.version }}\\`" >> $GITHUB_STEP_SUMMARY
          echo "- Regulated image: \\`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-regulated-copilot:${{ steps.ver.outputs.version }}\\`" >> $GITHUB_STEP_SUMMARY
