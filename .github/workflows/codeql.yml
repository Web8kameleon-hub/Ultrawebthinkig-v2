name: "CodeQL Focused Scan"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'ocean-core/**'
      - 'core/**'
      - 'libs/**'
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '.github/workflows/codeql.yml'
      - 'codeql-config.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./codeql-config.yml

      - name: Perform CodeQL Analysis
        id: codeql-analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Summarize CodeQL upload status
        if: always() && steps.codeql-analyze.outcome == 'failure'
        run: |
          echo "::warning::CodeQL analysis ran, but SARIF upload failed or code scanning is not enabled for this repository. Enable GitHub code scanning in repository settings to allow uploads."
          {
            echo "## CodeQL note"
            echo ""
            echo "- Analysis completed, but SARIF upload is currently non-blocking."
            echo "- Root cause: repository code scanning is disabled or unavailable for this repo."
            echo "- To restore full uploads, enable **Settings → Security → Code scanning**."
          } >> "$GITHUB_STEP_SUMMARY"
