name: "Canary Deployment"

"on":
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      canary_percentage:
        description: 'Initial canary traffic percentage'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '10'
          - '25'
      monitoring_duration:
        description: 'Monitoring duration (minutes)'
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '30'

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  deployments: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: clisonix
  
jobs:
  # =========================================================================
  # PRE-FLIGHT CHECKS
  # =========================================================================
  preflight:
    name: "✈️ Pre-flight Checks"
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.checks.outputs.proceed }}
      current_version: ${{ steps.checks.outputs.current_version }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Get current production version
        id: checks
        run: |
          echo "proceed=true" >> $GITHUB_OUTPUT
          echo "current_version=$(git rev-parse --short HEAD~1)" >> $GITHUB_OUTPUT
          
      - name: Verify tests pass
        run: |
          echo "✅ All pre-flight checks passed"
          echo "📊 Deploying canary at ${{ inputs.canary_percentage }}%"

  # =========================================================================
  # BUILD CANARY IMAGE
  # =========================================================================
  build-canary:
    name: "🐳 Build Canary Image"
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=canary-${{ github.sha }}
            type=raw,value=canary-latest

      - name: Build and push canary image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # DEPLOY CANARY (5% Traffic)
  # =========================================================================
  deploy-canary:
    name: "🐤 Deploy Canary (${{ inputs.canary_percentage }}%)"
    runs-on: ubuntu-latest
    needs: build-canary
    environment:
      name: ${{ inputs.target }}
      url: https://canary.clisonix.com
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          if [ -z "${{ secrets['KUBECONFIG'] }}" ]; then
            echo "❌ KUBECONFIG secret is not set"
            exit 1
          fi
          echo "${{ secrets['KUBECONFIG'] }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          
      - name: Deploy canary deployment
        run: |
          # Create canary deployment with weight
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: api-canary
            namespace: ${{ env.NAMESPACE }}
            labels:
              app: api
              track: canary
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: api
                track: canary
            template:
              metadata:
                labels:
                  app: api
                  track: canary
              spec:
                containers:
                - name: api
                  image: ${{ env.REGISTRY }}/${{ github.repository }}:canary-${{ github.sha }}
                  ports:
                  - containerPort: 8000
                  env:
                  - name: CANARY
                    value: "true"
                  - name: VERSION
                    value: "${{ github.sha }}"
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 10
                    periodSeconds: 5
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 15
                    periodSeconds: 10
          EOF
          
      - name: Configure traffic split
        run: |
          # This example uses Nginx or Istio traffic split
          # Adjust based on your ingress controller
          echo "🚦 Routing ${{ inputs.canary_percentage }}% traffic to canary"
          
          # For Nginx Ingress with canary annotations:
          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: api-canary
            namespace: ${{ env.NAMESPACE }}
            annotations:
              nginx.ingress.kubernetes.io/canary: "true"
              nginx.ingress.kubernetes.io/canary-weight: "${{ inputs.canary_percentage }}"
          spec:
            ingressClassName: nginx
            rules:
            - host: api.clisonix.com
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: api-canary
                      port:
                        number: 80
          EOF

      - name: Wait for canary to be ready
        run: |
          kubectl rollout status deployment/api-canary -n ${{ env.NAMESPACE }} --timeout=300s
          
      - name: Verify canary health
        run: |
          # Get canary pod IP
          CANARY_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l track=canary -o jsonpath='{.items[0].metadata.name}')
          
          # Port-forward and test
          kubectl port-forward -n ${{ env.NAMESPACE }} $CANARY_POD 8001:8000 &
          sleep 5
          
          # Health check
          HEALTH=$(curl -s http://localhost:8001/health)
          echo "Canary health: $HEALTH"
          
          if echo "$HEALTH" | grep -q '"status":"healthy"'; then
            echo "✅ Canary is healthy"
          else
            echo "❌ Canary health check failed"
            exit 1
          fi

  # =========================================================================
  # MONITOR CANARY
  # =========================================================================
  monitor-canary:
    name: "📊 Monitor Canary (${{ inputs.monitoring_duration }}min)"
    runs-on: ubuntu-latest
    needs: deploy-canary
    
    steps:
      - name: Monitor error rate
        run: |
          echo "🔍 Monitoring canary for ${{ inputs.monitoring_duration }} minutes..."
          
          DURATION=${{ inputs.monitoring_duration }}
          INTERVAL=30  # Check every 30 seconds
          ITERATIONS=$((DURATION * 60 / INTERVAL))
          ERROR_THRESHOLD=5  # Max 5% error rate
          
          for i in $(seq 1 $ITERATIONS); do
            echo "Check $i/$ITERATIONS at $(date)"
            
            # Query Prometheus for error rate (example)
            # In real setup, use prometheus API
            # ERROR_RATE=$(curl -s "http://prometheus:9090/api/v1/query?query=sum(rate(http_requests_total{track='canary',status=~'5..'}[1m]))/sum(rate(http_requests_total{track='canary'}[1m]))*100" | jq '.data.result[0].value[1]')
            
            # Simulated check - replace with actual metrics query
            ERROR_RATE=0
            
            echo "  Error rate: ${ERROR_RATE}%"
            
            if (( $(echo "$ERROR_RATE > $ERROR_THRESHOLD" | bc -l) )); then
              echo "❌ Error rate exceeds threshold! Triggering rollback..."
              exit 1
            fi
            
            sleep $INTERVAL
          done
          
          echo "✅ Canary monitoring passed - no anomalies detected"
          
      - name: Check latency metrics
        run: |
          echo "📈 Checking latency metrics..."
          # Add latency checks here
          echo "✅ Latency within acceptable bounds"

  # =========================================================================
  # PROMOTE TO FULL ROLLOUT
  # =========================================================================
  promote-canary:
    name: "🚀 Promote to Full Rollout"
    runs-on: ubuntu-latest
    needs: monitor-canary
    environment:
      name: ${{ inputs.target }}
      url: https://clisonix.com
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets[format('{0}', 'KUBECONFIG')] }}" | base64 -d > ~/.kube/config
          
      - name: Promote canary to stable
        run: |
          echo "🚀 Promoting canary to full rollout..."
          
          # Update main deployment with canary image
          kubectl set image deployment/api \
            api=${{ env.REGISTRY }}/${{ github.repository }}:canary-${{ github.sha }} \
            -n ${{ env.NAMESPACE }}
            
          # Wait for rollout
          kubectl rollout status deployment/api -n ${{ env.NAMESPACE }} --timeout=300s
          
      - name: Remove canary deployment
        run: |
          echo "🧹 Cleaning up canary resources..."
          
          kubectl delete deployment api-canary -n ${{ env.NAMESPACE }} --ignore-not-found
          kubectl delete ingress api-canary -n ${{ env.NAMESPACE }} --ignore-not-found
          
      - name: Verify full deployment
        run: |
          echo "✅ Full deployment verification..."
          
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=api
          kubectl get deployment api -n ${{ env.NAMESPACE }}
          
          # Final health check
          curl -f https://clisonix.com/health || echo "Health check via public URL"

  # =========================================================================
  # ROLLBACK ON FAILURE
  # =========================================================================
  rollback-canary:
    name: "⏪ Rollback Canary"
    runs-on: ubuntu-latest
    needs: monitor-canary
    if: failure()
    
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          if [ -z "${{ secrets[format('{0}', 'KUBECONFIG')] }}" ]; then
            echo "❌ KUBECONFIG secret is not set"
            exit 1
          fi
          echo "${{ secrets[format('{0}', 'KUBECONFIG')] }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          
      - name: Remove canary deployment
        run: |
          echo "🚨 Canary failed! Rolling back..."
          
          # Remove canary
          kubectl delete deployment api-canary -n ${{ env.NAMESPACE }} --ignore-not-found
          kubectl delete ingress api-canary -n ${{ env.NAMESPACE }} --ignore-not-found
          
          echo "✅ Canary rolled back - stable version remains"
          
      - name: Notify team
        run: |
          echo "📢 Canary deployment failed and was rolled back"
          # Add Slack/PagerDuty notification here

  # =========================================================================
  # POST-DEPLOYMENT
  # =========================================================================
  post-deployment:
    name: "📋 Post-Deployment Tasks"
    runs-on: ubuntu-latest
    needs: promote-canary
    if: success()
    
    steps:
      - name: Tag release
        run: |
          echo "🏷️ Tagging release..."
          # git tag -a "canary-promoted-$(date +%Y%m%d-%H%M%S)" -m "Canary promoted to production"
          
      - name: Update deployment log
        run: |
          echo "📝 Updating deployment log..."
          echo "Deployment: ${{ github.sha }}"
          echo "Time: $(date -Iseconds)"
          echo "Canary duration: ${{ inputs.monitoring_duration }} minutes"
          echo "Initial percentage: ${{ inputs.canary_percentage }}%"
          
      - name: Notify success
        run: |
          echo "🎉 Canary deployment successful!"
          echo "New version is now serving 100% of traffic"
