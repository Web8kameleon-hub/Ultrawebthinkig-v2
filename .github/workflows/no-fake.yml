name: No Fake Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce real-data-only runtime
        run: npm run no-fake:enforce

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-fake-audit
          path: reports/no-fake-audit.json
          if-no-files-found: error
