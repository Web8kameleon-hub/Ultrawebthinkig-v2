name: "🚀 Rebuild Docker Manual"

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Target host IP or DNS"
        required: true
        default: "46.225.14.83"
        type: string
      deploy_path:
        description: "Project path on server"
        required: true
        default: "/root/Clisonix-cloud"
        type: string
      scope:
        description: "What to rebuild/deploy"
        required: true
        default: "core"
        type: choice
        options:
          - core
          - linkedin
          - full

permissions:
  contents: read

concurrency:
  group: rebuild-docker-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false

jobs:
  rebuild:
    name: "🔧 Rebuild + Deploy (${{ inputs.scope }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate SSH secret
        run: |
          if [ -z "${{ secrets.HETZNER_SSH_KEY }}" ]; then
            echo "::error::HETZNER_SSH_KEY secret is not set"
            exit 1
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ inputs.host }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rebuild and deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o IdentitiesOnly=yes -i ~/.ssh/id_rsa root@${{ inputs.host }} << 'ENDSSH'
          set -e
          cd ${{ inputs.deploy_path }}

          echo "📍 Host: $(hostname)"
          echo "📂 Path: $(pwd)"
          echo "🎯 Scope: ${{ inputs.scope }}"

          if command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            COMPOSE="docker compose"
          fi

          echo "📥 Pull latest main"
          git pull origin main || true

          case "${{ inputs.scope }}" in
            core)
              SERVICES="web api ocean-core alba asi"
              echo "🔄 Rebuilding core services: $SERVICES"
              $COMPOSE up -d --build $SERVICES
              ;;
            linkedin)
              SERVICES="content-factory linkedin-poster blog_publisher"
              echo "🔄 Rebuilding LinkedIn flow services: $SERVICES"
              $COMPOSE up -d --build $SERVICES
              ;;
            full)
              echo "🔄 Rebuilding full stack (all services)"
              $COMPOSE up -d --build --remove-orphans
              ;;
            *)
              echo "❌ Invalid scope"
              exit 1
              ;;
          esac

          echo ""
          echo "🟢 RUNNING CONTAINERS"
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | head -60

          echo ""
          echo "⛔ NON-RUNNING CONTAINERS"
          docker ps -a --filter "status=exited" --filter "status=dead" --filter "status=created" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          ENDSSH

      - name: Write summary
        run: |
          echo "## 🚀 Rebuild Docker Manual" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Host: \`${{ inputs.host }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Path: \`${{ inputs.deploy_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Scope: \`${{ inputs.scope }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: rebuild + deploy" >> $GITHUB_STEP_SUMMARY
