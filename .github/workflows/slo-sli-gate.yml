name: SLO/SLI Gate - Critical Services

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: write   # needed to trigger ocean-core-selfheal

env:
  # Opt into Node.js 24 for all actions (avoids Node.js 20 deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  slo-sli-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "api",         url: "http://46.225.14.83:8000/health",  allow_failure: false }
          - { name: "ocean-core",  url: "http://46.225.14.83:8030/health",  allow_failure: false }
          # openmind (port 9999) is currently unreachable from GitHub Actions runners
          # (HTTP 000 / connection refused); mark allow_failure so the gate issues
          # a warning instead of a hard error until the service is restored.
          - { name: "openmind",    url: "http://46.225.14.83:9999/health",  allow_failure: true  }
          - { name: "excel",       url: "http://46.225.14.83:8002/health",  allow_failure: false }
          - { name: "ollama",      url: "http://46.225.14.83:11434",        allow_failure: false }
          - { name: "translation", url: "http://46.225.14.83:8036/health",  allow_failure: false }
    steps:
      - name: Probe health endpoint
        run: |
          START=$(date +%s%3N)
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 8 "${{ matrix.service.url }}" || true)
          END=$(date +%s%3N)
          LATENCY=$((END-START))
          echo "service=${{ matrix.service.name }} code=$HTTP_CODE latency_ms=$LATENCY"

          # HTTP 000 means curl could not connect at all (firewall / service down)
          if [ "$HTTP_CODE" = "000" ]; then
            if [ "${{ matrix.service.allow_failure }}" = "true" ]; then
              echo "::warning::${{ matrix.service.name }} unreachable (connection failed) — non-blocking"
            else
              echo "::error::${{ matrix.service.name }} unreachable (connection failed)"
              exit 1
            fi
          elif [ "$HTTP_CODE" -ge 500 ]; then
            echo "::error::${{ matrix.service.name }} failed health gate (HTTP $HTTP_CODE)"
            exit 1
          elif [ "$HTTP_CODE" -lt 200 ]; then
            echo "::error::${{ matrix.service.name }} unexpected HTTP code (HTTP $HTTP_CODE)"
            exit 1
          fi

          if [ "$LATENCY" -gt 2000 ]; then
            echo "::warning::${{ matrix.service.name }} latency high (${LATENCY}ms)"
          fi

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: slo-sli-probe-${{ matrix.service.name }}-${{ github.run_id }}
          path: /tmp/resp.txt

  # Auto-heal ocean-core when it fails the gate
  ocean-core-heal-on-failure:
    needs: slo-sli-check
    if: failure()
    uses: ./.github/workflows/ocean-core-selfheal.yml
    with:
      mode: heal
    secrets: inherit

