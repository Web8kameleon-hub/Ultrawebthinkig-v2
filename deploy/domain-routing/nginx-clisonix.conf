server {
    listen 80;
    listen [::]:80;
    server_name kameleon.life www.kameleon.life;

    return 301 https://app.clisonix.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name clisonix.com www.clisonix.com;

    return 301 https://clisonix.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clisonix.com www.clisonix.com;

    ssl_certificate /etc/letsencrypt/live/clisonix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clisonix.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/clisonix.com/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.clisonix.com;

    ssl_certificate /etc/letsencrypt/live/app.clisonix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.clisonix.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

