[package]
name = "oceancore-edge-node"
version = "0.1.0"
edition = "2021"
description = "Rust proof-of-life agent for the Clisonix KLOUd bridge hardware contract"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
