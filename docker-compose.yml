services:
  # ==========================
  # DATABASES
  # ==========================
  postgres:
    image: postgres:16-alpine
    container_name: clisonix-postgres
    environment:
      POSTGRES_USER: clisonix
      POSTGRES_PASSWORD: clisonix
      POSTGRES_DB: clisonixdb
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clisonix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clisonix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================
  # NEO4J (Graph Database)
  # ==========================
  neo4j:
    image: neo4j:5-community
    container_name: clisonix-neo4j
    environment:
      NEO4J_AUTH: neo4j/clisonix123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ==========================
  # MINIO (Object Storage)
  # ==========================
  minio:
    image: minio/minio:latest
    container_name: clisonix-minio
    environment:
      MINIO_ROOT_USER: clisonix
      MINIO_ROOT_PASSWORD: clisonix123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # ASI TRINITY - ALBA (Analytical Intelligence)
  # ==========================
  alba:
    build:
      context: .
      dockerfile: Dockerfile.alba
    container_name: clisonix-alba
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # ASI TRINITY - ALBI (Creative Intelligence)
  # ==========================
  albi:
    build:
      context: .
      dockerfile: Dockerfile.albi
    container_name: clisonix-albi
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://redis:6379/0"
      PORT: "6680"
    ports:
      - "6680:6680"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6680/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # ALBI USER EEG API (Real-time User Module)
  # ==========================
  albi-user:
    build:
      context: .
      dockerfile: Dockerfile.albi-user
    container_name: clisonix-albi-user
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "6681:6681"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6681/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # ASI TRINITY - JONA (Emotional Intelligence)
  # ==========================
  jona:
    build:
      context: .
      dockerfile: Dockerfile.jona
    container_name: clisonix-jona
    command: >
      sh -c "python -m uvicorn jona_neural_api:app --host 0.0.0.0 --port 7777"
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://redis:6379/0"
      PORT: "7777"
    ports:
      - "7777:7777"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # OLLAMA (LLM Backend)
  # ==========================
  ollama:
    image: ollama/ollama:latest
    container_name: clisonix-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ==========================
  # OLLAMA MULTI-API (Multi-Model Router)
  # ==========================
  ollama-multi-api:
    build:
      context: .
      dockerfile: Dockerfile.ollama-multi
    container_name: clisonix-ollama-multi-api
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_HOST: "http://clisonix-ollama:11434"
      PORT: "4444"
    ports:
      - "4444:4444"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # OCEAN-CORE (Knowledge Engine & Curiosity AI)
  # ==========================
  ocean-core:
    build:
      context: ./ocean-core
      dockerfile: Dockerfile
    container_name: clisonix-ocean-core
    # env_file removed - using environment variables directly
    environment:
      PYTHONUNBUFFERED: "1"
      OCEAN_PORT: "8030"
      OLLAMA_HOST: "http://clisonix-ollama:11434"
      MODEL: "llama3.1:8b"
      OCEAN_AUTOLEARNING_ENABLED: "true"
      OCEAN_LLM_PROVIDER_ORDER: "ollama,openai_compat,selflearning"
      OCEAN_SOVEREIGN_SELFREGEN_ENABLED: "true"
      OCEAN_SELFREGEN_REBUILD_MAX_LINES: "2000"
      DEBATE_MAX_TOKENS_HARD: "1200"
      DEBATE_STREAM_MAX_CONCURRENCY: "2"
      DEBATE_STREAM_QUEUE_LIMIT: "8"
      DEBATE_RATE_LIMIT_REQUESTS: "6"
      REDIS_URL: "redis://redis:6379/0"
      API_KEYS_FILE: "/app/config/api_keys.json"
      CLISONIX_SYSTEM_PROMPT_PATH: "/app/CLISONIX_SYSTEM_PROMPT.md"
      CLISONIX_MODULE_MAP_PATH: "/app/CLISONIX_MODULE_MAP.md"
    volumes:
      - ./config/api_keys.json:/app/config/api_keys.json:ro
      - ./CLISONIX_SYSTEM_PROMPT.md:/app/CLISONIX_SYSTEM_PROMPT.md:ro
      - ./CLISONIX_MODULE_MAP.md:/app/CLISONIX_MODULE_MAP.md:ro
    ports:
      - "8030:8030"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # OCEAN MISSION SERVICE (Generic Mission Executor)
  # ==========================
  ocean-mission-service:
    build:
      context: .
      dockerfile: ocean-core/Dockerfile.mission
    container_name: clisonix-ocean-mission
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "9500"
      MISSION_DB_PATH: "/app/data/ocean_missions.db"
      PYTHON_BIN: "python"
    volumes:
      - ./data:/app/data
    ports:
      - "9500:9500"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # REGULATORY SERVICE (Sandbox/Drift/Change/Liability/Federated)
  # ==========================
  regulatory-service:
    build:
      context: ./services/regulatory
      dockerfile: Dockerfile
    container_name: clisonix-regulatory
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "9501"
      REGULATORY_JURISDICTION: "EU"
      REGULATORY_DATA_REGION: "EU"
      REGULATORY_PROFILE: "wellness-v1"
      CERTIFIED_MODEL_VERSION: "clisonix-default:certified"
      BASELINE_SUCCESS_RATE: "0.95"
      BASELINE_RETRY_RATE: "0.05"
      DRIFT_WARNING_THRESHOLD: "0.05"
      DRIFT_CRITICAL_THRESHOLD: "0.10"
      FEDERATED_TARGETS: "EU"
    volumes:
      - ./data:/app/data
    ports:
      - "9501:9501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ocean-core-multimodal:
    build:
      context: ./ocean-core
      dockerfile: Dockerfile.multimodal
    container_name: clisonix-ocean-core-multimodal
    environment:
      PYTHONUNBUFFERED: "1"
      OCEAN_PORT: "8033"
      PORT: "8033"
      OLLAMA_HOST: "http://clisonix-ollama:11434"
    ports:
      - "8033:8033"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8033/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ocean-core-strict-chat:
    build:
      context: ./ocean-core
      dockerfile: Dockerfile.strict-chat
    container_name: clisonix-ocean-core-strict-chat
    environment:
      PYTHONUNBUFFERED: "1"
      OCEAN_PORT: "8035"
      OLLAMA_HOST: "http://clisonix-ollama:11434"
    ports:
      - "8035:8035"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8035/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ocean-core-blerina:
    build:
      context: ./ocean-core
      dockerfile: Dockerfile.blerina
    container_name: clisonix-ocean-core-blerina
    environment:
      PYTHONUNBUFFERED: "1"
      OCEAN_PORT: "8032"
      OLLAMA_HOST: "http://clisonix-ollama:11434"
    ports:
      - "8032:8032"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8032/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # AVIATION WEATHER API (Microservice)
  # ==========================
  aviation:
    build:
      context: ./services/aviation-weather
      dockerfile: Dockerfile
    container_name: clisonix-aviation
    environment:
      PYTHONUNBUFFERED: "1"
      AVIATION_PORT: "8080"
      AVWX_API_KEY: "${AVWX_API_KEY:-}"
      CHECKWX_API_KEY: "${CHECKWX_API_KEY:-}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # API BACKEND (JONA - Coordinator)
  # ==========================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: clisonix-api
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      API_PORT: "8000"
      JONA_API_URL: "http://jona:7777"
      DATABASE_URL: "postgresql://clisonix:clisonix@postgres:5432/clisonixdb"
      REDIS_URL: "redis://redis:6379/0"
      # Marketplace URL for tier-based rate limiting plan lookups
      MARKETPLACE_URL: "http://clisonix-marketplace:8004"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jona:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # FRONTEND
  # ==========================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-${CLERK_PUBLISHABLE_KEY:-}}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-${STRIPE_PUBLISHABLE_KEY:-}}
        NEXT_PUBLIC_API_BASE: /api
        NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${NEXT_PUBLIC_GOOGLE_ADSENSE_ID:-}
    container_name: clisonix-web
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      # Use Docker internal network for server-side API calls
      API_INTERNAL_URL: "http://clisonix-api:8000"
      OCEAN_INTERNAL_URL: "http://ocean-core:8030"
      OCEAN_CORE_URL: "http://ocean-core:8030"
      NEWSROOM_PUBLIC_URL: ${NEWSROOM_PUBLIC_URL:-http://newsroom:9800}
      # Client-side calls go through Nginx proxy
      NEXT_PUBLIC_API_BASE: "/api"
      # Clerk Authentication
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-${CLERK_PUBLISHABLE_KEY:-}}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: "/dashboard"
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: "/dashboard"
      # Stripe Payments
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-${STRIPE_PUBLISHABLE_KEY:-}}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # Google AdSense (set publisher ID to enable ads)
      NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${NEXT_PUBLIC_GOOGLE_ADSENSE_ID:-}
      GOOGLE_ADSENSE_PUBLISHER_ID: ${GOOGLE_ADSENSE_PUBLISHER_ID:-}
      ADSENSE_SLOT_FOOTER: ${ADSENSE_SLOT_FOOTER:-}
      ADSENSE_SLOT_SIDEBAR: ${ADSENSE_SLOT_SIDEBAR:-}
      ADSENSE_SLOT_ARTICLE_TOP: ${ADSENSE_SLOT_ARTICLE_TOP:-}
      ADSENSE_SLOT_ARTICLE_BOTTOM: ${ADSENSE_SLOT_ARTICLE_BOTTOM:-}
      # Affiliate tracking: marketplace URL for commission tracking
      AFFILIATE_TRACKING_URL: "http://clisonix-blog-api:8050"
      # Kitchen API
      KITCHEN_JOBS_DIR: "/app/kitchen-jobs"
      KITCHEN_REPORTS_DIR: "/app/kitchen-reports"
      KITCHEN_RUN_API_KEY: ${KITCHEN_RUN_API_KEY:-clisonix-kitchen-secret}
    ports:
      - "3000:3000"
    volumes:
      # Share kitchen jobs/reports with worker
      - kitchen_jobs:/app/kitchen-jobs
      - kitchen_reports:/app/kitchen-reports
    depends_on:
      api:
        condition: service_healthy
      ocean-core:
        condition: service_healthy
    restart: unless-stopped

  # ==========================
  # VICTORIAMETRICS (Long-term Storage)
  # ==========================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.96.0
    container_name: clisonix-victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - ./data/victoriametrics:/victoria-metrics-data
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=12"
      - "-httpListenAddr=0.0.0.0:8428"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # PROMETHEUS (Metrics Collection)
  # ==========================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: clisonix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # GRAFANA (Visualization)
  # ==========================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: clisonix-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: clisonix123
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - victoriametrics
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # LOKI (Log Aggregation)
  # ==========================
  loki:
    image: grafana/loki:2.9.2
    container_name: clisonix-loki
    ports:
      - "3102:3100"
    volumes:
      - ./data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # JAEGER (Distributed Tracing)
  # ==========================
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: clisonix-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:16686/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # TEMPO (Trace Backend)
  # ==========================
  tempo:
    image: grafana/tempo:2.3.1
    container_name: clisonix-tempo
    ports:
      - "3200:3200"
      - "9095:9095"
    volumes:
      - ./data/tempo:/tmp/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # NGINX (Reverse Proxy)
  # ==========================
  nginx:
    image: nginx:alpine
    container_name: clisonix-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # ASI ENGINE (Artificial Super Intelligence)
  # ==========================
  asi:
    build:
      context: .
      dockerfile: Dockerfile.asi
    container_name: clisonix-asi
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://redis:6379/0"
      ASI_HQ_EVENT_URL: "${ASI_HQ_EVENT_URL:-http://clisonix-api:8000/mesh/status}"
      ASI_HQ_REGISTER_URL: "${ASI_HQ_REGISTER_URL:-http://clisonix-api:8000/mesh/register}"
      ASI_HQ_STATUS_URL: "${ASI_HQ_STATUS_URL:-http://clisonix-api:8000/mesh/status}"
      ASI_AUDIO_UPLOAD_URL: "${ASI_AUDIO_UPLOAD_URL:-https://clisonix.com/api/uploads/audio/process}"
      ASI_EEG_UPLOAD_URL: "${ASI_EEG_UPLOAD_URL:-https://clisonix.com/api/uploads/eeg/process}"
      ASI_REQUEST_TIMEOUT_SECONDS: "${ASI_REQUEST_TIMEOUT_SECONDS:-5}"
      ASI_REQUEST_MAX_RETRIES: "${ASI_REQUEST_MAX_RETRIES:-3}"
      ASI_REQUEST_RETRY_BACKOFF_SECONDS: "${ASI_REQUEST_RETRY_BACKOFF_SECONDS:-0.5}"
    ports:
      - "9094:9094"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9094/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # MARKETPLACE (API Keys, Billing, SaaS)
  # ==========================
  marketplace:
    build:
      context: .
      dockerfile: Dockerfile.marketplace
    container_name: clisonix-marketplace
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: "redis://redis:6379/0"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # DEVELOPER PORTAL (API Key Management UI)
  # ==========================
  developer-portal:
    build:
      context: .
      dockerfile: Dockerfile.developer-portal
    container_name: clisonix-developer-portal
    environment:
      PYTHONUNBUFFERED: "1"
      DEV_PORTAL_PORT: "8005"
      MARKETPLACE_URL: "http://clisonix-marketplace:8004"
      ANALYTICS_URL: "http://clisonix-analytics:8006"
    ports:
      - "8005:8005"
    depends_on:
      marketplace:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
