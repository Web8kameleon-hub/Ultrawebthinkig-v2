  # ==========================
  # KITCHEN WORKER (Newman Test Runner)
  # ==========================
  kitchen-worker:
    build:
      context: ./services/kitchen-worker
      dockerfile: Dockerfile
    container_name: clisonix-kitchen-worker
    environment:
      NODE_ENV: "production"
      KITCHEN_JOBS_DIR: "/app/kitchen-jobs"
      KITCHEN_REPORTS_DIR: "/app/kitchen-reports"
      COLLECTIONS_DIR: "/app/postman-collections"
      POLL_INTERVAL_MS: "3000"
      MAX_CONCURRENT_JOBS: "2"
      HEALTH_PORT: "3100"
    ports:
      - "3100:3100"
    volumes:
      # Share jobs/reports with web container
      - kitchen_jobs:/app/kitchen-jobs
      - kitchen_reports:/app/kitchen-reports
      # Mount Postman collections from postman-collections folder only
      - ./postman-collections:/app/postman-collections:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================
  # NEWSROOM SERVICE v6.0 — High-Level Multi-Engine
  # ==========================
  newsroom:
    build:
      context: ./services/newsroom
      dockerfile: Dockerfile
    container_name: clisonix-newsroom
    environment:
      PYTHONUNBUFFERED: "1"
      BLOG_API_URL: "http://blog-api:8041"
      FB_PAGE_ID: "1012708485262154"
      FB_PAGE_TOKEN: "${FB_PAGE_TOKEN:-placeholder_token}"
      NEWSROOM_PORT: "9800"
      PUBLISH_INTERVAL: "3600"
      MAX_LABS: "200"
      POSTS_PER_DAY: "10"
      REDIS_URL: "redis://redis:6379/1"
      ENGINE_TIMEOUT: "3.0"
      # Internal engine URLs (clisonix-net)
      ALBA_URL:     "http://alba:5555"
      ALBI_URL:     "http://albi:6680"
      JONA_URL:     "http://jona:7777"
      OCEAN_URL:    "http://ocean-core:8030"
      BLERINA_URL:  "http://ocean-core-blerina:8032"
      ASI_URL:      "http://asi:9094"
      AVIATION_URL: "http://aviation:8080"
      API_INTERNAL_URL: "http://api:8000"
      # External API keys (optional)
      GNEWS_API_KEY:  "${GNEWS_API_KEY:-}"
      NEWSAPI_KEY:    "${NEWSAPI_KEY:-}"
    ports:
      - "9800:9800"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9800/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./services/newsroom/.env:/app/.env:ro

  # ==========================
  # ORCHESTRA DIVISION (9700)
  # Unified signal orchestrator
  # ==========================
  orchestra:
    build:
      context: .
      dockerfile: Dockerfile.orchestra
    container_name: clisonix-orchestra
    ports:
      - "9700:9700"
    environment:
      # GitHub
      GITHUB_TOKEN:   ${GITHUB_TOKEN:-}
      GITHUB_REPO:    ${GITHUB_REPO:-Web8kameleon-hub/clisonix.com}
      # Cloudflare
      CF_API_TOKEN:   ${CF_API_TOKEN:-}
      CF_ZONE_ID:     ${CF_ZONE_ID:-}
      CF_ACCOUNT_ID:  ${CF_ACCOUNT_ID:-}
      # Hetzner
      ORCHESTRA_HETZNER_IP: ${ORCHESTRA_HETZNER_IP:-46.225.14.83}
      # Cache
      REDIS_URL:      ${REDIS_URL:-redis://redis:6379}
      # Clients API
      CLISONIX_API_URL:       ${CLISONIX_API_URL:-http://api:8000}
      CLISONIX_INTERNAL_KEY:  ${CLISONIX_INTERNAL_KEY:-}
      # Git
      GIT_EXPECTED_ORG: Web8kameleon-hub
      GIT_REPO_PATH:    /app
      # Misc
      LOG_LEVEL:      ${LOG_LEVEL:-INFO}
      ORCHESTRA_TIMEOUT_S: "15"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9700/health"]
      interval: 30s
      timeout: 8s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
