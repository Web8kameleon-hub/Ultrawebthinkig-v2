services:
  billing-core:
    build: ./services/billing_core
    container_name: clisonix-billing-core
    ports:
      - "8095:8095"
    environment:
      - PORT=8095
      - BILLING_DATA_DIR=/data
      - BILLING_PUBLIC_URL=http://localhost:8095
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER:-}
      - STRIPE_PRICE_PROFESSIONAL=${STRIPE_PRICE_PROFESSIONAL:-}
      - STRIPE_PRICE_BUSINESS=${STRIPE_PRICE_BUSINESS:-}
    volumes:
      - billing-core-data:/data
    restart: unless-stopped
    networks:
      - clisonix-net

volumes:
  billing-core-data:

networks:
  clisonix-net:
    external: true
