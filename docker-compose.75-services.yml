  newsroom:
    build:
      context: ./services/newsroom
      dockerfile: Dockerfile
    container_name: clisonix-newsroom
    env_file:
    - ./services/newsroom/.env
    environment:
      PYTHONUNBUFFERED: '1'
      BLOG_API_URL: http://blog-api:8041
      NEWSROOM_PORT: '9800'
      PUBLISH_INTERVAL: '3600'
      MAX_LABS: '200'
      POSTS_PER_DAY: '10'
      REDIS_URL: redis://redis:6379/1
      ENGINE_TIMEOUT: '3.0'
      ALBA_URL: http://alba:5555
      ALBI_URL: http://albi:6680
      JONA_URL: http://jona:7777
      OCEAN_URL: http://ocean-core:8030
      BLERINA_URL: http://ocean-core-blerina:8032
      ASI_URL: http://asi:9094
      AVIATION_URL: http://aviation:8080
      API_INTERNAL_URL: http://api:8000
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
    ports:
    - 9800:9800
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9800/health',
        timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
