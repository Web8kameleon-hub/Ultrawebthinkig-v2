x-python-service:
  image: python:3.11-slim
  working_dir: /app
  volumes: &id001
  - ./:/app
  - pip-cache:/root/.cache/pip
  environment: &id004
  - PYTHONUNBUFFERED=1
  - PYTHONIOENCODING=UTF-8
  - LANG=C.UTF-8
  - REDIS_URL=redis://redis:6379/0
  - DATABASE_URL=postgresql://clisonix:clisonix@postgres:5432/clisonixdb
  restart: 'no'
  deploy: &id002
    resources:
      limits:
        memory: 256M
        cpus: '0.25'
  networks: &id003
  - clisonix-net
services:
  postgres:
    image: postgres:16-alpine
    container_name: clisonix-postgres
    environment:
      POSTGRES_USER: clisonix
      POSTGRES_PASSWORD: clisonix
      POSTGRES_DB: clisonixdb
    ports:
    - 5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U clisonix
      interval: 10s
      timeout: 5s
      retries: 5
    restart: 'no'
    networks:
    - clisonix-net
  redis:
    image: redis:7-alpine
    container_name: clisonix-redis
    ports:
    - 6379:6379
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: 'no'
    networks:
    - clisonix-net
  neo4j:
    image: neo4j:5-community
    container_name: clisonix-neo4j
    environment:
      NEO4J_AUTH: neo4j/clisonix123
    ports:
    - 7474:7474
    - 7687:7687
    volumes:
    - neo4j-data:/data
    restart: 'no'
    networks:
    - clisonix-net
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: clisonix-victoriametrics
    ports:
    - 8428:8428
    volumes:
    - victoria-data:/victoria-metrics-data
    command: -storageDataPath=/victoria-metrics-data -retentionPeriod=90d
    restart: 'no'
    networks:
    - clisonix-net
  minio:
    image: minio/minio:latest
    container_name: clisonix-minio
    environment:
      MINIO_ROOT_USER: clisonix
      MINIO_ROOT_PASSWORD: clisonix123
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - minio-data:/data
    command: server /data --console-address ":9001"
    restart: 'no'
    networks:
    - clisonix-net
  ollama:
    image: ollama/ollama:latest
    container_name: clisonix-ollama
    ports:
    - 11434:11434
    volumes:
    - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    healthcheck:
      test:
      - CMD-SHELL
      - ollama list || exit 0
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
    - clisonix-net
  ollama-multi-api:
    image: python:3.11-slim
    working_dir: /app
    volumes: *id001
    environment:
    - OLLAMA_HOST=http://ollama:11434
    restart: 'no'
    deploy: *id002
    networks: *id003
    container_name: clisonix-ollama-multi
    command: 'bash -c "pip install --no-cache-dir -q uvicorn fastapi pydantic aiohttp
      httpx && cd ocean-core && python ollama_multi_api.py"

      '
    ports:
    - 4444:4444
    depends_on:
    - ollama
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4444/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
  ocean-core:
    image: python:3.11-slim
    working_dir: /app
    volumes: *id001
    environment:
    - OLLAMA_HOST=http://ollama:11434
    - CENTRAL_API_URL=http://clisonix-api:8000
    - OPENMIND_URL=http://clisonix-openmind:9999
    - EXCEL_CORE_URL=http://clisonix-excel:8002
    restart: 'no'
    deploy: *id002
    networks: *id003
    container_name: clisonix-ocean-core
    command: 'bash -c "pip install --no-cache-dir -q -r ocean-core/requirements.txt
      && cd ocean-core && python ocean_core_full.py"

      '
    ports:
    - 8030:8030
    depends_on:
    - ollama
    - ollama-multi-api
    - redis
  alba:
    image: python:3.11-slim
