    volumes:
    - grafana-data:/var/lib/grafana
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=clisonix
    restart: 'no'
    networks:
    - clisonix-net
  loki:
    image: grafana/loki:latest
    container_name: clisonix-loki
    ports:
    - 3100:3100
    volumes:
    - loki-data:/loki
    restart: 'no'
    networks:
    - clisonix-net
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: clisonix-jaeger
    ports:
    - 16686:16686
    - 4317:4317
    - 4318:4318
    environment:
    - COLLECTOR_OTLP_ENABLED=true
    restart: 'no'
    networks:
    - clisonix-net
  tempo:
    image: grafana/tempo:latest
    container_name: clisonix-tempo
    user: root
    ports:
    - 3200:3200
    - 4319:4317
    volumes:
    - tempo-data:/var/tempo
    - ./tempo.yaml:/etc/tempo.yaml:ro
    command:
    - -config.file=/etc/tempo.yaml
    restart: 'no'
    networks:
    - clisonix-net
  agent-telemetry:
    build:
      context: ./services/agent-telemetry
      dockerfile: Dockerfile
    container_name: clisonix-agent-telemetry
    ports:
    - 8009:8009
    restart: 'no'
    networks:
    - clisonix-net
  cognitive-engine:
    image: python:3.11-slim
    working_dir: /app
    volumes: *id001
    environment: *id004
    restart: 'no'
    deploy: *id002
    networks: *id003
    container_name: clisonix-cognitive
    command: 'bash -c "pip install --no-cache-dir -q uvicorn fastapi pydantic && cd
      ocean-core && python -c \"import uvicorn; from fastapi import FastAPI; app =
      FastAPI(title=''Cognitive Signature Engine''); health_route = app.get(''/health'')(lambda:
      {''status'': ''healthy'', ''engine'': ''cognitive''}); uvicorn.run(app, host=''0.0.0.0'',
      port=8010)\""

      '
    ports:
    - 8010:8010
  adaptive-router:
    image: python:3.11-slim
    working_dir: /app
    volumes: *id001
    environment: *id004
    restart: 'no'
    deploy: *id002
    networks: *id003
    container_name: clisonix-adaptive-router
    command: 'bash -c "pip install --no-cache-dir -q uvicorn fastapi pydantic && cd
      ocean-core && python -c \"import uvicorn; from fastapi import FastAPI; app =
      FastAPI(title=''Adaptive Persona Router''); health_route = app.get(''/health'')(lambda:
      {''status'': ''healthy'', ''personas'': 4}); uvicorn.run(app, host=''0.0.0.0'',
      port=8011)\""

      '
    ports:
    - 8011:8011
  health-monitor:
    image: python:3.11-slim
    working_dir: /app
    volumes: *id001
    environment: *id004
    restart: 'no'
    deploy: *id002
    networks: *id003
    container_name: clisonix-health-monitor
    command: 'bash -c "pip install --no-cache-dir -q uvicorn fastapi pydantic httpx
      && python -c \"import uvicorn; from fastapi import FastAPI; app = FastAPI(title=''Clisonix
      Health Monitor''); health_route = app.get(''/health'')(lambda: {''status'':
      ''healthy'', ''monitored_services'': 9}); uvicorn.run(app, host=''0.0.0.0'',
      port=8099)\""

      '
    ports:
    - 8099:8099
    depends_on:
    - api
    - alba
    - ollama
  knowledge:
    build:
      context: ./services/knowledge_index
      dockerfile: Dockerfile
    container_name: clisonix-knowledge
    environment:
      PYTHONUNBUFFERED: '1'
      REDIS_URL: redis://redis:6379/0
    ports:
    - 8012:8012
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8012/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  linkedin-poster:
    build:
      context: .
      dockerfile: services/content-factory/Dockerfile.linkedin
    container_name: clisonix-linkedin-poster
    env_file:
    - ${CLISONIX_ENV_FILE:-.env}
    environment:
      PYTHONUNBUFFERED: '1'
      PORT: '8007'
      LINKEDIN_PERSON_URN: ${LINKEDIN_PERSON_URN:-urn:li:person:5KOBp94BOT}
      SITE_URL: ${SITE_URL:-https://clisonix.com}
      BLOG_URL: ${BLOG_URL:-https://ledjanahmati.github.io/clisonix-blog/}
      LINKEDIN_POLL_SECONDS: '15'
      LINKEDIN_POST_ALL_PENDING: 'true'
      LINKEDIN_SCAN_DOCUMENTS: 'true'
      LINKEDIN_DOCUMENT_DIRS: /app/blerina_pillars,/app/medical_pillars,/app/lagter_pillars
      LINKEDIN_DOCUMENT_GLOB: '*.md'
      LINKEDIN_TRIGGER_LAGTER: 'true'
      LAGTER_TRIGGER_URL: ${LAGTER_TRIGGER_URL:-http://clisonix-lagter:9500/api/v1/publish/batch}
    ports:
    - 8021:8007
    volumes:
    - ./data/linkedin:/app/data
    - ./all_pillars:/app/blerina_pillars:ro
    - ./generated_medical_pillars:/app/medical_pillars:ro
    - ./lagter_pillars:/app/lagter_pillars:ro
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8007/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  matia:
    build:
      context: .
      dockerfile: Dockerfile.matia
    container_name: clisonix-matia
    environment:
      PYTHONUNBUFFERED: '1'
      PORT: '7200'
    ports:
    - 7200:7200
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:7200/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  mongodb:
    image: mongo:7
    container_name: clisonix-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-clisonix}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-CHANGE_ME_SECURE_PASSWORD_MIN_32_CHARS}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-starbooking}
    ports:
    - 27017:27017
    volumes:
    - ./data/mongodb:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 15s
      timeout: 10s
      retries: 8
