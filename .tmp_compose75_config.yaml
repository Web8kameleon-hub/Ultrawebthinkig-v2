name: clisonix-cloud
services:
  adaptive-router:
    command:
      - bash
      - -c
      - 'pip install --no-cache-dir -q uvicorn fastapi pydantic && cd ocean-core && python -c "import uvicorn; from fastapi import FastAPI; app = FastAPI(title=''Adaptive Persona Router''); health_route = app.get(''/health'')(lambda: {''status'': ''healthy'', ''personas'': 4}); uvicorn.run(app, host=''0.0.0.0'', port=8011)"'
    container_name: clisonix-adaptive-router
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: "268435456"
    environment:
      DATABASE_URL: postgresql://clisonix:clisonix@postgres:5432/clisonixdb
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379/0
    image: python:3.11-slim
    networks:
      clisonix-net: null
    ports:
      - mode: ingress
        target: 8011
        published: "8011"
        protocol: tcp
    restart: "no"
    volumes:
      - type: bind
        source: C:\Users\Admin\Desktop\Clisonix-cloud
        target: /app
        bind: {}
      - type: volume
        source: pip-cache
        target: /root/.cache/pip
        volume: {}
    working_dir: /app
